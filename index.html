<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Palace Archive | Vessel Chronicles</title>
    
    <!-- Fontes Oficiais -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --alma: #7ad7ff; 
            --texto-claro: rgba(255, 255, 255, 0.9); 
            --bg-caixa: rgba(0, 0, 0, 0.85);
            --glow-titulo: 0 0 20px #7ad7ff, 0 0 40px #fff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #000; color: white;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        body::before {
            content: " "; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.05) 50%);
            z-index: 150; background-size: 100% 4px; pointer-events: none;
        }

        .bg-layer {
            position: fixed; inset: 0;
            background-image: url('pure_vessel/palacio_fundo.webp');
            background-position: center; background-repeat: no-repeat; background-size: cover;
            filter: brightness(0.6); z-index: -2; transition: filter 1.5s ease-in-out;
        }

        #vessel {
            position: absolute; height: 450px; z-index: 9999;
            image-rendering: pixelated; pointer-events: none;
            filter: drop-shadow(0 0 15px white);
            display: none; transform: translate(-50%, -50%);
        }

        @keyframes megaShake {
            0% { transform: translate(0,0); }
            10% { transform: translate(-10px, 8px) rotate(-1deg); }
            30% { transform: translate(12px, -6px) rotate(1deg); }
            100% { transform: translate(0,0); }
        }
        .mega-shaking { animation: megaShake 0.15s infinite; }

        @keyframes shake {
            0% { transform: translate(calc(-50% + 2px), calc(-50% + 2px)); }
            100% { transform: translate(calc(-50% - 2px), calc(-50% - 2px)); }
        }
        .shaking { animation: shake 0.1s infinite; }

        #infection-overlay {
            position: fixed; inset: 0; z-index: 10005;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        #infection-overlay svg { width: 100%; height: 100%; fill: #ff8c00; filter: drop-shadow(0 0 15px #ff4500); }
        .vine { transform: scale(0); transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: center; }
        .infecting .vine { transform: scale(3); }
        .infecting #infection-overlay { opacity: 1; }

        .radiance-burst {
            position: fixed; inset: 0; z-index: 10006; pointer-events: none;
            background: radial-gradient(circle, #fff 0%, #ffae00 40%, #ff4500 70%, transparent 100%);
            opacity: 0; mix-blend-mode: screen;
        }

        .nav-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            padding: 20px 15px; background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--alma); color: var(--alma);
            cursor: pointer; z-index: 10002; transition: 0.3s;
            font-family: 'Cinzel', serif; font-size: 0.7rem; text-align: center;
        }
        #nav-right { right: 0; border-radius: 15px 0 0 15px; }
        #nav-left { left: 0; border-radius: 0 15px 15px 0; }

        .content { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; padding: 100px 20px; }
        
        .text-block { 
            background: var(--bg-caixa); border-left: 6px solid var(--alma); margin-bottom: 80px;
            height: 0; padding: 0 40px; overflow: hidden; opacity: 0;
            transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s, opacity 0.5s;
        }
        .text-block.open { height: auto; padding: 40px; opacity: 1; min-height: 150px; }

        h1 { 
            font-family: 'Cinzel Decorative', cursive; font-size: clamp(2rem, 7vw, 5rem); 
            text-align: center; margin-bottom: 40px; color: white;
            text-shadow: var(--glow-titulo); transition: 0.5s;
            min-height: 1.2em; white-space: nowrap; width: 100%;
        }
        h2 { font-family: 'Cinzel', serif; color: var(--alma); margin-bottom: 15px; }
        .typewriter { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.1rem, 4vw, 1.6rem); line-height: 1.6; color: var(--texto-claro); }

        .hud { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            font-family: 'Cinzel', serif; font-size: clamp(0.55rem, 2vw, 0.75rem); 
            background: rgba(0,0,0,0.9); color: white; padding: 12px 30px; z-index: 10001;
            border: 1px solid var(--alma); text-align: center; width: 95%; max-width: 650px;
        }

        .mobile-skills {
            display: none; position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%);
            gap: 8px; z-index: 10003; width: 95%; justify-content: center;
        }
        .mobile-skills button {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--alma); color: var(--alma);
            padding: 12px 5px; font-family: 'Cinzel', serif; font-size: 0.6rem; flex: 1; border-radius: 4px;
        }

        @media (max-width: 768px) {
            #vessel { height: 280px; }
            .nav-btn { top: 15%; transform: none; padding: 10px; }
            .mobile-skills { display: flex; }
        }
    </style>
</head>
<body id="body">

    <audio id="bgm" loop><source src="pure_vessel/pure_vessel.mp3" type="audio/mpeg"></audio>
    <div class="bg-layer" id="bg-layer"></div>
    <div id="flash" style="position:fixed; inset:0; background:#fff; opacity:0; z-index:10000; pointer-events:none;"></div>

    <div id="infection-overlay"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path class="vine" d="M0,0 Q20,50 0,100 L-10,100 L-10,0 Z" /><path class="vine" d="M100,0 Q80,50 100,100 L110,100 L110,0 Z" /></svg></div>
    
    <div id="nav-right" class="nav-btn" onclick="transformToSealed()">HOLLOW KNIGHT →</div>
    <div id="nav-left" class="nav-btn" onclick="revertToPure()" style="display: none;">← PURE VESSEL</div>

    <img id="vessel" src="">

    <div class="content">
        <h1 id="main-title">Pure Vessel</h1>
        <div class="text-block" id="block1">
            <h2 id="t1">A Lâmina de Hallownest</h2>
            <p id="p1" class="typewriter" data-text="No ápice da civilização de Hallownest, o Receptáculo Puro ergueu-se como o baluarte final. Uma forma perfeita, moldada pela vontade de um Rei e temperada no vazio, destinada a selar a luz que consumia o mundo."></p>
        </div>
        <div class="text-block" id="block2">
            <h2 id="t2">O Selo Silencioso</h2>
            <p id="p2" class="typewriter" data-text="Sua silhueta prateada era o símbolo de uma esperança silenciosa. Sem mente para pensar, sem vontade para quebrar... a lâmina impecável que carregava o destino de um reino em declínio."></p>
        </div>
    </div>

    <div class="mobile-skills">
        <button onclick="mobileAttack('s')">SLASH</button>
        <button onclick="mobileAttack('d')">DASH</button>
        <button onclick="mobileAttack('r')">ROAR</button>
        <button id="btn-extra" onclick="mobileAttack('extra')">POSE</button>
    </div>

    <div class="hud" id="hud-text">[S] SLASH | [D] DASH | [R] ROAR | [A] POSE | CLIQUE: PARRY</div>

    <script>
        const vessel = document.getElementById('vessel'), bgm = document.getElementById('bgm'), flash = document.getElementById('flash');
        let isInfected = false, current = 'none', frame = 0, isActive = false, waitCount = 0, typewriterTimeouts = [];

        const animPure = {
            intro: { start: 77, end: 84, next: 'idle' },
            idle: { start: 102, end: 106, next: 'teleport_out', limit: 35 },
            dash: { start: 22, end: 28, next: 'teleport_out', shake: true },
            roar: { start: 110, end: 121, next: 'teleport_out', shake: true },
            slashes: { start: 135, end: 151, next: 'teleport_out' },
            pose: { start: 65, end: 69, next: 'teleport_out', limit: 40 },
            parry: { start: 12, end: 21, next: 'teleport_out' },
            teleport_out: { start: 164, end: 168, next: 'none' }
        };

        const animSealed = {
            idle: { start: 135, end: 141, next: 'idle', limit: 10 },
            dash: { start: 38, end: 44, next: 'teleport', shake: true },
            roar: { start: 179, end: 190, next: 'teleport', shake: true },
            slashes: { start: 204, end: 220, next: 'teleport' },
            stab: { start: 16, end: 27, next: 'teleport', shake: true },
            teleport: { start: 93, end: 98, next: 'none' }
        };

        function spawnVessel(x, y, action) {
            if (isActive && current !== 'idle' && current !== 'intro' && action !== 'roar') return;
            isActive = true; waitCount = 0; vessel.style.display = 'block';
            vessel.style.left = x + 'px'; vessel.style.top = y + 'px';
            current = action; frame = (isInfected ? animSealed : animPure)[action].start;
            vessel.classList.remove('shaking');
            if((isInfected ? animSealed : animPure)[action].shake) setTimeout(()=>vessel.classList.add('shaking'), 10);
        }

        function update() {
            if (current === 'none') return;
            const set = isInfected ? animSealed : animPure;
            const folder = isInfected ? 'sealead_vessel' : 'pure_vessel';
            const prefix = isInfected ? 'Hollow Knight Boss Cln_' : 'HK Prime Cln_';
            vessel.src = `${folder}/${prefix}${frame.toString().padStart(3, '0')}.png`;
            frame++;
            if (frame > set[current].end) {
                if (set[current].next === current && waitCount < (set[current].limit || 0)) { frame = set[current].start; waitCount++; }
                else {
                    let next = set[current].next;
                    if (current === 'idle' && waitCount >= (set[current].limit || 0)) next = isInfected ? 'teleport' : 'teleport_out';
                    if (!next || next === 'none') { vessel.style.display = 'none'; current = 'none'; isActive = false; vessel.classList.remove('shaking'); }
                    else { current = next; frame = set[next].start; waitCount = 0; }
                }
            }
        }
        setInterval(update, 90);

        function triggerTypewriter() {
            typewriterTimeouts.forEach(clearTimeout); typewriterTimeouts = [];
            const titleEl = document.getElementById('main-title'), titleText = titleEl.innerText; titleEl.innerText = "";
            let charIdx = 0;
            function typeTitle() {
                if (charIdx < titleText.length) { titleEl.innerText += titleText.charAt(charIdx++); typewriterTimeouts.push(setTimeout(typeTitle, 50)); }
                else {
                    document.querySelectorAll('.text-block').forEach((block, idx) => {
                        typewriterTimeouts.push(setTimeout(() => {
                            block.classList.add('open');
                            const p = block.querySelector('.typewriter'), text = p.getAttribute('data-text');
                            let pIdx = 0; p.innerHTML = "";
                            function typePara() { if (pIdx < text.length) { p.innerHTML += text.charAt(pIdx++); typewriterTimeouts.push(setTimeout(typePara, 30)); } }
                            typePara();
                        }, idx * 600));
                    });
                }
            }
            typeTitle();
        }

        function transformToSealed() {
            if (isInfected) return;
            document.body.classList.add('mega-shaking', 'infecting');
            const burst = document.createElement('div'); burst.className = 'radiance-burst'; document.body.appendChild(burst);
            setTimeout(()=>burst.style.opacity='1', 800);
            setTimeout(() => {
                isInfected = true; isActive = false; current = 'none'; vessel.style.display = 'none';
                document.getElementById('bg-layer').style.backgroundImage = "url('sealead_vessel/fundo_infectado.webp')";
                bgm.src = "sealead_vessel/sealed_vessel_theme.mp3"; bgm.load(); bgm.play().catch(()=>{});
                document.documentElement.style.setProperty('--alma', '#ff8c00');
                document.documentElement.style.setProperty('--glow-titulo', '0 0 25px #ff4500, 0 0 50px #ffae00');
                document.getElementById('main-title').innerText = "The Hollow Knight";
                document.getElementById('hud-text').innerText = "[S] SLASH | [D] DASH | [R] ROAR | [H] STAB | CLIQUE: STAB";
                document.getElementById('p1').setAttribute('data-text', "O Receptáculo foi corrompido pela luz alaranjada da antiga praga. A vontade do Rei falhou diante da Radiância.");
                document.getElementById('p2').setAttribute('data-text', "Sua agonia ressoa no Ovo Negro. Um herói caído que apunhala o próprio peito para liberar a infecção e encerrar o seu sofrimento.");
                document.getElementById('nav-right').style.display = 'none'; document.getElementById('nav-left').style.display = 'block';
                document.getElementById('btn-extra').innerText = "STAB";
                document.querySelectorAll('.text-block').forEach(b => b.classList.remove('open'));
                triggerTypewriter();
                spawnVessel(window.innerWidth / 2, (window.innerHeight / 2) + window.scrollY, 'roar');
                setTimeout(() => { burst.remove(); document.body.classList.remove('mega-shaking', 'infecting'); }, 1000);
            }, 1300);
        }

        function revertToPure() {
            if (!isInfected) return;
            isActive = false; current = 'none'; vessel.style.display = 'none'; flash.style.opacity = '1';
            setTimeout(() => {
                isInfected = false;
                document.getElementById('bg-layer').style.backgroundImage = "url('pure_vessel/palacio_fundo.webp')";
                bgm.src = "pure_vessel/pure_vessel.mp3"; bgm.load(); bgm.play().catch(()=>{});
                document.documentElement.style.setProperty('--alma', '#7ad7ff');
                document.documentElement.style.setProperty('--glow-titulo', '0 0 20px #7ad7ff, 0 0 40px #fff');
                document.getElementById('main-title').innerText = "Pure Vessel";
                document.getElementById('hud-text').innerText = "[S] SLASH | [D] DASH | [R] ROAR | [A] POSE | CLIQUE: PARRY";
                document.getElementById('p1').setAttribute('data-text', "No ápice do Palácio Branco, o Receptáculo atingiu sua forma absoluta. Uma forma perfeita destinada a selar a luz que consumia o mundo.");
                document.getElementById('p2').setAttribute('data-text', "Uma memória sagrada mantida no Lar dos Deuses. Sem mente para pensar, sem vontade para quebrar... Perfeição moldada pelo vazio.");
                document.getElementById('nav-right').style.display = 'flex'; document.getElementById('nav-left').style.display = 'none';
                document.getElementById('btn-extra').innerText = "POSE";
                document.querySelectorAll('.text-block').forEach(b => b.classList.remove('open'));
                triggerTypewriter();
                spawnVessel(window.innerWidth / 2, (window.innerHeight / 2) + window.scrollY, 'intro');
                setTimeout(() => flash.style.opacity = '0', 200);
            }, 600);
        }

        function mobileAttack(key) {
            const x = window.innerWidth/2, y = window.innerHeight/2 + window.scrollY;
            if(key==='extra') key = isInfected ? 'h' : 'a';
            spawnVessel(x, y, (key==='s'?'slashes':key==='d'?'dash':key==='r'?'roar':key==='h'?'stab':'pose'));
        }

        window.addEventListener('mousedown', (e) => { 
            if (e.target.closest('.nav-btn') || e.target.closest('.mobile-skills')) return;
            spawnVessel(e.pageX, e.pageY, isInfected ? 'stab' : 'parry'); 
        });

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.nav-btn') || e.target.closest('.mobile-skills')) return;
            spawnVessel(e.touches[0].pageX, e.touches[0].pageY, isInfected ? 'stab' : 'parry');
        });

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase(), x = window.innerWidth/2, y = window.innerHeight/2 + window.scrollY;
            if (isActive && current !== 'idle' && current !== 'intro') return;
            if (!isInfected) {
                if (k === 's') spawnVessel(x, y, 'slashes'); if (k === 'd') spawnVessel(x, y, 'dash');
                if (k === 'r') spawnVessel(x, y, 'roar'); if (k === 'a') spawnVessel(x, y, 'pose');
            } else {
                if (k === 's') spawnVessel(x, y, 'slashes'); if (k === 'd') spawnVessel(x, y, 'dash');
                if (k === 'r') spawnVessel(x, y, 'roar'); if (k === 'h') spawnVessel(x, y, 'stab');
            }
        });

        triggerTypewriter();
        window.addEventListener('click', () => { if(bgm.paused){bgm.volume=0.4; bgm.play();} }, { once: true });
    </script>
</body>
</html>
